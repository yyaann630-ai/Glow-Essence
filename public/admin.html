<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="theme-color" content="#faf5ec"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><header class="top"><div class="brand">Admin <small>Kelola toko</small></div><div class="row" id="hd" hidden><button class="g s" data-sfx-btn></button><button class="g s" onclick="out()">Keluar</button></div></header>
<div class="ad"><div id="login" hidden class="lg2"><h2 style="font-size:28px;text-align:center">Masuk admin</h2><form onsubmit="return login(event)"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p class="err" id="er"></p><button id="lb" style="width:100%">Masuk</button></form></div>
<div id="app" hidden><nav class="nav" id="nav"></nav><div id="pane"></div></div></div>
<dialog id="dlx"><h2 style="font-size:24px">Catat uang keluar</h2>
<label for="xa">Jumlah (Rp)</label><input id="xa" type="number" min="1" inputmode="numeric"><label for="xn">Untuk apa?</label><input id="xn" maxlength="100" placeholder="Mis. beli stok, ongkir, kemasan">
<div class="row" style="margin-top:18px"><button class="g" onclick="dlx.close()">Batal</button><button class="fl" onclick="addX()">Simpan</button></div></dialog>
<dialog id="dlg"><h2 id="dt" style="font-size:24px">Produk</h2>
<label for="pn">Nama produk</label><input id="pn" maxlength="80"><label for="pp">Harga (Rp)</label><input id="pp" type="number" min="0" inputmode="numeric">
<label for="pc">Kategori</label><select id="pc"></select><label for="pd">Deskripsi (opsional)</label><textarea id="pd" rows="2" maxlength="300"></textarea>
<label for="pf">Foto produk</label><input id="pf" type="file" accept="image/*" onchange="pickPhoto(this)"><img class="prev" id="pv" alt="" hidden><button class="r s" id="rp" hidden onclick="rmPhoto()">Hapus foto</button>
<div class="row" style="margin-top:18px"><button class="g" onclick="dlg.close()">Batal</button><button class="fl" id="sv" onclick="saveP()">Simpan</button></div></dialog>
<script src="/sfx.js"></script>
<script>
const $=s=>document.querySelector(s),f=n=>'Rp '+n.toLocaleString('id-ID'),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(async r=>{const j=await r.json();if(r.status==401&&u!='/api/login'){showLogin();throw new Error('login')}if(!r.ok)throw new Error(j.error);return j});
const TABS={o:'Pesanan',x:'Transaksi',k:'Keuangan',v:'Ulasan',p:'Produk',t:'Tampilan'};let tab='o',os=[],sig='',alarm=0,tm,S,edit=null,photo;
const err=x=>x.message!='login'&&alert(x.message);
const shrink=(file,max,type)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');if(type=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(type,.85))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)});
function showLogin(){clearInterval(tm);sfx.alarm(0);alarm=0;$('#login').hidden=false;$('#app').hidden=true;$('#hd').hidden=true}
async function login(ev){ev.preventDefault();$('#er').textContent='';try{await api('/api/login','POST',{password:$('#pw').value.trim()});$('#pw').value='';start()}catch(x){$('#er').textContent=x.message}return false}
async function out(){await api('/api/logout','POST',{});showLogin()}
function start(){$('#login').hidden=true;$('#app').hidden=false;$('#hd').hidden=false;go(tab);clearInterval(tm);tm=setInterval(poll,5000)}
function nav(){const w=os.filter(o=>o.status=='waiting').length;$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}${k=='o'&&w?`<em>${w}</em>`:''}</button>`).join('')}
async function go(k){tab=k;nav();try{await({o:ordersR,x:trxR,k:moneyR,v:revR,p:productsR,t:tampilanR})[k]()}catch(x){err(x)}}
async function poll(){try{os=await api('/api/admin/orders');const w=os.some(o=>o.status=='waiting');if(w!=alarm){alarm=w;sfx.alarm(w?1:0)}nav();const n=JSON.stringify(os);if(tab=='o'&&n!=sig){sig=n;draw()}}catch{}}
const wa=p=>{let n=p.replace(/\D/g,'');if(n[0]=='0')n='62'+n.slice(1);return 'https://wa.me/'+n};
const FOL={antar:'Antar ke rumah',ambil:'Ambil di tempat',cod:'COD'},DONE={antar:'Tandai dikirim',ambil:'Sudah diambil',cod:'Selesai, uang diterima'};
function card(o){const fu=o.fulfil||'antar',st={waiting:['Perlu konfirmasi','w'],paid:['Dikemas',''],done:[fu=='antar'?'Dikirim':'Selesai',''],cancelled:['Dibatalkan','x']}[o.status];
 return `<div class="card"><div class="row"><b class="fl">#${o.id} · ${e(o.customer)}</b><span class="tag ${st[1]}">${st[0]}</span></div>
 <div class="mu">${hm(o.created_at)} · ${FOL[fu]} · ${o.method=='cash'?'Tunai':'QRIS'} · <a href="${wa(o.phone)}" target="_blank" rel="noopener">${e(o.phone)}</a></div>${o.address?`<div class="mu" style="margin-top:4px">${e(o.address)}</div>`:''}
 <div style="margin:10px 0">${o.items.map(i=>`<div>${i.qty}× ${e(i.name)}</div>`).join('')}${o.note?`<div class="mu">Catatan: ${e(o.note)}</div>`:''}</div>
 ${o.soldOut?.length&&o.status=='waiting'?`<p class="err">Stok habis: ${o.soldOut.map(e).join(', ')}</p>`:''}
 <div class="row"><b class="fl">${f(o.total)}</b>${o.status=='waiting'?`<button class="s" onclick="act(${o.id},'confirm')">${o.method=='cash'?'Terima pesanan':'Terima pembayaran'}</button>`:''}${o.status=='paid'?`<button class="s" onclick="act(${o.id},'done')">${DONE[fu]}</button>`:''}${['waiting','paid'].includes(o.status)?`<button class="r s" onclick="act(${o.id},'cancel',1)">Batalkan</button>`:''}</div></div>`}
function draw(){const now=new Date().toDateString(),td=os.filter(o=>new Date(o.created_at).toDateString()==now&&o.status!='cancelled'),ok=td.filter(o=>['paid','done'].includes(o.status));
 const K=[['Pesanan hari ini',td.length],['Omzet hari ini',f(ok.reduce((a,o)=>a+o.total,0))],['Perlu konfirmasi',os.filter(o=>o.status=='waiting').length],['Sedang dikemas',os.filter(o=>o.status=='paid').length]];
 const col=(s,t,cap,empty)=>{const all=os.filter(o=>s.includes(o.status)),l=all.slice(0,cap);return `<section><h3 class="sec"><span>${t}</span><span class="tag${s[0]=='waiting'&&all.length?' w':''}">${all.length}</span></h3>${l.length?l.map(card).join(''):`<div class="none">${empty}</div>`}</section>`};
 $('#pane').innerHTML=`<div class="kps">${K.map(k=>`<div class="kp"><b>${e(k[1])}</b><span>${k[0]}</span></div>`).join('')}</div><div class="kan" style="margin-top:14px">${col(['waiting'],'Perlu konfirmasi',99,'Pesanan baru akan muncul di sini dan berbunyi.')}${col(['paid'],'Sedang dikemas',99,'Pesanan yang sudah diterima tampil di sini.')}${col(['done','cancelled'],'Riwayat',15,'Pesanan selesai atau batal tampil di sini.')}</div>`}
async function ordersR(){os=await api('/api/admin/orders');sig=JSON.stringify(os);const w=os.some(o=>o.status=='waiting');if(w!=alarm){alarm=w;sfx.alarm(w?1:0)}nav();draw()}
let xs=[],xf='all';
const XS={unpaid:['Belum bayar','x'],waiting:['Menunggu','w'],paid:['Dikemas','bl'],done:['Selesai','ok'],cancelled:['Dibatalkan','x']},XF={all:['Semua',()=>true],open:['Berjalan',o=>['unpaid','waiting','paid'].includes(o.status)],done:['Selesai',o=>o.status=='done'],cancelled:['Dibatalkan',o=>o.status=='cancelled']};
const dk=t=>new Date(t).toLocaleDateString('en-CA');
async function trxR(){xs=await api('/api/admin/transactions');trxD()}
function setXf(k){xf=k;trxD()}
function trxD(){const sh=xs.filter(XF[xf][1]);
 const K=[['Pesanan 5 hari',xs.length],['Nilai pesanan aktif',f(xs.filter(o=>['waiting','paid','done'].includes(o.status)).reduce((a,o)=>a+o.total,0))],['Selesai',xs.filter(o=>o.status=='done').length],['Dibatalkan',xs.filter(o=>o.status=='cancelled').length]];
 const days=[];for(let i=0;i<5;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(dk(d))}
 $('#pane').innerHTML=`<h3 class="sec" style="margin:0 0 12px">Transaksi 5 hari terakhir</h3><div class="kps">${K.map(k=>`<div class="kp"><b>${e(k[1])}</b><span>${k[0]}</span></div>`).join('')}</div>
 <div class="flt">${Object.entries(XF).map(([k,[t,fn]])=>`<button class="${k==xf?'on':''}" onclick="setXf('${k}')">${t} (${xs.filter(fn).length})</button>`).join('')}</div>`
 const per=days.map(d=>[d,sh.filter(o=>dk(o.created_at)==d)]),full=per.filter(x=>x[1].length),none=per.filter(x=>!x[1].length);
 $('#pane').insertAdjacentHTML('beforeend',`<div class="days">${full.map(([d,l])=>{const sum=l.filter(o=>o.status!='cancelled'&&o.status!='unpaid').reduce((a,o)=>a+o.total,0);
 return `<div class="card"><div class="row"><h3 class="sec fl">${tgl(d)}</h3><span class="tag">${l.length} pesanan</span><b>${f(sum)}</b></div>${l.map(o=>{const fu=o.fulfil||'antar',st=XS[o.status]||['',''];return `<div class="tr"><b>#${o.id}</b><div><b>${e(o.customer)}</b><div class="mu" style="font-size:13px">${o.items.map(i=>`${i.qty}× ${e(i.name)}`).join(', ')}</div></div><span class="tag ${st[1]}">${st[0]}</span><span class="mu">${hm(o.created_at)} · ${FOL[fu]}${o.method?' · '+(o.method=='cash'?'Tunai':'QRIS'):''}</span><span class="v">${f(o.total)}</span></div>`}).join('')}</div>`}).join('')}${xs.length?(()=>{const live=xs.filter(o=>o.status!='cancelled'),grp=(fn)=>{const m={};live.forEach(o=>{const k=fn(o);m[k]=m[k]||[0,0];m[k][0]++;m[k][1]+=o.total});return m},R=(m)=>Object.entries(m).map(([k,[n,t]])=>`<div class="ln"><span>${k} <span class="mu">· ${n} pesanan</span></span><b>${f(t)}</b></div>`).join(''),top={};live.forEach(o=>o.items.forEach(i=>{top[i.name]=(top[i.name]||0)+i.qty}));
 return `<div class="card"><h3 class="sec" style="margin-top:0">Per cara terima</h3>${R(grp(o=>FOL[o.fulfil||'antar']))}<h3 class="sec">Per cara bayar</h3>${R(grp(o=>o.method?(o.method=='cash'?'Tunai':'QRIS'):'Belum dipilih'))}</div><div class="card"><h3 class="sec" style="margin-top:0">Produk terlaris</h3>${Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([n,q],i)=>`<div class="ln"><span><b>${i+1}.</b> ${e(n)}</span><b>${q} terjual</b></div>`).join('')||'<p class="mu">Belum ada.</p>'}</div>`})():''}${none.length?`<div class="card"><h3 class="sec">Tanpa transaksi</h3><div class="row">${none.map(([d])=>`<span class="tag">${tgl(d)}</span>`).join('')}</div></div>`:''}</div>`)}
const tgl=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
async function moneyR(){const r=await api('/api/admin/finance'),d=r.days,sum=k=>d.reduce((a,x)=>a+x[k],0),t=d[0],p=r.pending;
 $('#pane').innerHTML=`<div class="row" style="margin-bottom:14px"><h3 class="fl sec" style="margin:0">Keuangan 5 hari terakhir</h3><button onclick="openX()">Catat uang keluar</button></div>
 <div class="kps">${[['Masuk hari ini',f(t.income)],['Keluar hari ini',f(t.expense)],['Laba hari ini',f(t.income-t.expense)],['Laba 5 hari',f(sum('income')-sum('expense'))]].map(k=>`<div class="kp"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
 ${p.n?`<div class="card"><b>${p.n} pesanan belum dihitung</b><div class="mu">Senilai ${f(p.total)}. Masuk ke keuangan setelah uangnya benar-benar diterima.</div></div>`:''}
 <div class="days">${d.map(x=>`<div class="card"><h3 class="sec">${tgl(x.date)}</h3><div class="row"><span class="tag">Masuk ${f(x.income)}</span><span class="tag x">Keluar ${f(x.expense)}</span><b class="fl" style="text-align:right">${f(x.income-x.expense)}</b></div>
 ${x.tx.length?x.tx.map(y=>`<div class="ln"><span><span class="mu">${hm(y.created_at)}</span> ${e(y.note)}</span><span class="row" style="flex-wrap:nowrap"><b style="color:${y.type=='in'?'var(--p6)':'#8a6200'}">${y.type=='in'?'+':'−'}${f(y.amount)}</b>${y.type=='out'?`<button class="r s" onclick="delX(${y.id})" aria-label="Hapus">×</button>`:''}</span></div>`).join(''):'<p class="mu" style="margin:10px 0 0">Belum ada transaksi.</p>'}</div>`).join('')}</div>`}
async function revR(){const l=await api('/api/admin/reviews'),n=l.length,avg=n?(l.reduce((a,r)=>a+r.rating,0)/n).toFixed(1):'0';
 $('#pane').innerHTML=`<h3 class="sec" style="margin:0 0 12px">Ulasan pelanggan</h3><div class="kps">${[['Jumlah ulasan',n],['Rata-rata bintang',avg+' ★']].map(k=>`<div class="kp"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
 <div class="days" style="margin-top:14px">${l.map(r=>`<div class="card"><div class="row"><b class="fl">${e(r.customer)}</b><span class="tag">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><div class="mu">${tgl(dk(r.created_at))} · Pesanan #${r.order_id}${r.items.length?' · '+r.items.map(i=>e(i.name)).join(', '):''}</div>${r.comment?`<p style="margin:10px 0">${e(r.comment)}</p>`:''}<button class="r s" style="margin-top:8px" onclick="delR(${r.id})">Hapus</button></div>`).join('')||'<div class="card"><p class="mu" style="margin:0">Belum ada ulasan.</p></div>'}</div>`}
async function delR(id){if(!confirm('Hapus ulasan ini?'))return;try{await api('/api/admin/reviews/'+id,'DELETE');revR()}catch(x){err(x)}}
function openX(){$('#xa').value='';$('#xn').value='';dlx.showModal()}
async function addX(){try{await api('/api/admin/expense','POST',{amount:$('#xa').value,note:$('#xn').value});dlx.close();sfx.play('rem');moneyR()}catch(x){err(x)}}
async function delX(id){if(!confirm('Hapus pengeluaran ini?'))return;try{await api('/api/admin/tx/'+id,'DELETE');moneyR()}catch(x){err(x)}}
async function act(id,a,c){if(c&&!confirm('Batalkan pesanan ini?'))return;try{await api(`/api/admin/orders/${id}/${a}`,'POST',{});sfx.play({confirm:'success',done:'done',cancel:'rem'}[a]);poll()}catch(x){err(x)}}
async function productsR(){S=await api('/api/shop');
 const cat=S.categories.map(c=>`<span class="tag">${e(c.name)} <a href="#" onclick="delCat(${c.id});return false" aria-label="Hapus kategori ${e(c.name)}">×</a></span>`).join(' ');
 $('#pane').innerHTML=`<div class="aside"><div class="card"><h3>Kategori</h3><div class="row" style="margin:10px 0">${cat||'<span class="mu">Belum ada kategori</span>'}</div><div class="row"><input class="fl" id="nc" placeholder="Kategori baru, mis. Gelang"><button class="s" onclick="addCat()">Tambah</button></div></div>
 <div><div class="row" style="margin:0 0 14px"><h3 class="fl sec" style="margin:0">Produk (${S.items.length})</h3><button onclick="openP()">Tambah produk</button></div>
 <div class="pg">${S.items.map(p=>`<div class="card"><div class="row" style="flex-wrap:nowrap">${p.ver?`<img class="th" src="/api/img/p${p.id}?v=${p.ver}" alt="">`:'<div class="th"></div>'}<div class="fl"><b>${e(p.name)}</b><div class="pr">${f(p.price)}</div><div class="mu">${e(S.categories.find(c=>c.id==p.category_id)?.name||'')}${p.available?'':' · Habis'}</div></div></div>
 <div class="row" style="margin-top:12px"><button class="g s" onclick="openP(${p.id})">Edit</button><button class="g s" onclick="tog(${p.id})">${p.available?'Tandai habis':'Tersedia lagi'}</button><button class="r s" onclick="delP(${p.id})">Hapus</button></div></div>`).join('')||'<div class="card"><div class="es" style="padding:24px"><p class="mu">Belum ada produk. Klik "Tambah produk" untuk mulai.</p></div></div>'}</div></div></div>`}
async function addCat(){try{await api('/api/admin/categories','POST',{name:$('#nc').value});productsR()}catch(x){err(x)}}
async function delCat(id){if(!confirm('Hapus kategori ini beserta semua produknya?'))return;try{await api('/api/admin/categories/'+id,'DELETE');productsR()}catch(x){err(x)}}
async function tog(id){try{await api(`/api/admin/products/${id}/toggle`,'POST',{});productsR()}catch(x){err(x)}}
async function delP(id){if(!confirm('Hapus produk ini?'))return;try{await api('/api/admin/products/'+id,'DELETE');productsR()}catch(x){err(x)}}
function showPv(src){$('#pv').hidden=!src;if(src)$('#pv').src=src;$('#rp').hidden=!src}
function openP(id){if(!S.categories.length)return alert('Buat kategori dulu');edit=id?S.items.find(p=>p.id==id):null;photo=undefined;
 $('#dt').textContent=edit?'Edit produk':'Produk baru';$('#pn').value=edit?.name||'';$('#pp').value=edit?.price??'';$('#pd').value=edit?.description||'';$('#pf').value='';
 $('#pc').innerHTML=S.categories.map(c=>`<option value="${c.id}"${edit&&edit.category_id==c.id?' selected':''}>${e(c.name)}</option>`).join('');
 showPv(edit?.ver?`/api/img/p${edit.id}?v=${edit.ver}`:'');dlg.showModal()}
async function pickPhoto(inp){const fl=inp.files[0];if(!fl)return;try{photo=await shrink(fl,900,'image/jpeg');showPv(photo)}catch{alert('Gambar tidak bisa dibaca')}}
function rmPhoto(){photo='';$('#pf').value='';showPv('')}
async function saveP(){$('#sv').disabled=true;const b={name:$('#pn').value,price:$('#pp').value,category_id:$('#pc').value,description:$('#pd').value};if(photo!==undefined)b.photo=photo;
 try{await api(edit?'/api/admin/products/'+edit.id:'/api/admin/products',edit?'PUT':'POST',b);dlg.close();productsR()}catch(x){err(x)}$('#sv').disabled=false}
const IM={logo:['Logo',600,'image/png','Tampil bulat di pojok kiri atas. Pakai gambar persegi.'],banner:['Banner',1600,'image/jpeg','Gambar lebar di bagian atas toko, ideal sekitar 1600×600.'],qris:['Gambar QRIS',1200,'image/png','Ditampilkan ke pelanggan yang memilih bayar QRIS.']};
async function tampilanR(){S=await api('/api/shop');
 $('#pane').innerHTML=`<div class="aside"><div class="card"><label for="sn" style="margin-top:0">Nama toko</label><input id="sn" maxlength="80" value="${e(S.name)}"><label for="st">Kalimat singkat di banner</label><input id="st" maxlength="80" value="${e(S.tagline)}"><label for="sp">Alamat toko (tampil untuk "Ambil di tempat")</label><input id="sp" maxlength="160" value="${e(S.pickup)}"><label for="sw">Nomor WhatsApp admin (untuk tombol "Chat Admin" pelanggan)</label><input id="sw" type="tel" inputmode="tel" maxlength="20" placeholder="08xxxxxxxxxx" value="${e(S.wa?'0'+S.wa.replace(/^62/,''):'')}"><p class="mu" style="margin:6px 0 0">Kosongkan kalau tidak mau menampilkan tombol chat.</p><div style="margin-top:14px"><button onclick="saveTxt()">Simpan</button></div></div>`+
 `<div class="pg" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card" style="background:var(--p1);border:0"><h3>Pratinjau</h3><div class="row" style="margin-top:10px;flex-wrap:nowrap">${S.logo?`<img class="th" style="border-radius:50%" src="/api/img/logo?v=${S.v}" alt="">`:'<div class="th" style="border-radius:50%"></div>'}<div><b style="font:600 22px 'Cormorant Garamond',Georgia,serif">${e(S.name)}</b><div class="mu">${e(S.tagline)}</div></div></div>${S.pickup?`<p class="mu" style="margin:10px 0 0">📍 ${e(S.pickup)}</p>`:''}${S.wa?`<p style="margin:10px 0 0"><span class="tag ok">💬 Chat Admin: 0${e(S.wa.replace(/^62/,''))}</span></p>`:'<p class="mu" style="margin:10px 0 0">Nomor WhatsApp belum diisi.</p>'}</div>`+Object.entries(IM).map(([k,[t,,,d]])=>`<div class="card"><h3>${t}</h3><p class="mu" style="margin:4px 0">${d}</p>${S[k]?`<img class="prev" src="/api/img/${k}?v=${S.v}" alt="${t}">`:''}<div class="row" style="margin-top:8px"><input class="fl" type="file" accept="image/*" onchange="up('${k}',this)">${S[k]?`<button class="r s" onclick="rm('${k}')">Hapus</button>`:''}</div></div>`).join('')+'</div></div>'}
async function saveTxt(){try{await api('/api/admin/setting/name','PUT',{value:$('#sn').value});await api('/api/admin/setting/tagline','PUT',{value:$('#st').value});await api('/api/admin/setting/pickup','PUT',{value:$('#sp').value});await api('/api/admin/setting/wa','PUT',{value:$('#sw').value});tampilanR()}catch(x){err(x)}}
async function up(k,inp){const fl=inp.files[0];if(!fl)return;try{const d=await shrink(fl,IM[k][1],IM[k][2]);await api('/api/admin/setting/'+k,'PUT',{value:d});tampilanR()}catch(x){err(x)}}
async function rm(k){if(!confirm('Hapus gambar ini?'))return;try{await api('/api/admin/setting/'+k,'DELETE');tampilanR()}catch(x){err(x)}}
